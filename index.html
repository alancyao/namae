  <body>
    <div id="app"></div>
    <!-- Shown when the app's own script or stylesheet does not load, which is a first visit with no connection.
         The text is src/copy.ts errors.offlineFirstRun; tests/unit/ui.test.ts keeps the two in step.
         Both notes are placed on the screen by themselves (position: fixed). In the flow of the page they sat
         under #app, which the stylesheet makes as tall as the screen, so with the stylesheet loaded and the
         script not started they were below the fold of a page that does not scroll: an empty dark screen. -->
    <p id="boot-note" hidden style="position: fixed; top: 30vh; right: 0; left: 0; margin: 0 auto; max-width: 20em; padding: 0 24px; color: #fff4dc; font: 700 17px/1.4 system-ui, sans-serif; text-align: center">
      You're offline. Open Namae once online, and it works offline from then on.
    </p>
    <!-- Shown when the browser lacks something the app cannot do without (the script below). The text is
         src/copy.ts errors.unsupportedBrowser; tests/unit/ui.test.ts keeps the two in step. -->
    <p id="unsupported-note" hidden style="position: fixed; top: 30vh; right: 0; left: 0; margin: 0 auto; max-width: 20em; padding: 0 24px; color: #fff4dc; font: 700 17px/1.4 system-ui, sans-serif; text-align: center">
      Namae needs a newer browser. Update this one, then open Namae again.
    </p>
    <script>
      // Written for the oldest browsers: no syntax newer than ES5, since this is what has to run where the
      // app's own script does not. The app needs Object.hasOwn (Safari 15.4, Chrome 93, Firefox 92) and
      // compression streams with the 'deflate-raw' format (Safari 16.4, Chrome 103, Firefox 113), which sync
      // packs every update with. The constructors are called because some browsers have the classes without
      // that format. src/main.tsx does not start the app when window.namaeUnsupported is set.
      (function () {
        var supported = typeof Object.hasOwn === 'function' && typeof WebSocket === 'function';
        try {
          new CompressionStream('deflate-raw');
          new DecompressionStream('deflate-raw');
        } catch (error) {
          supported = false;
        }
        if (supported) return;
        window.namaeUnsupported = true;
        var note = document.getElementById('unsupported-note');
        if (note) note.hidden = false;
      })();
      addEventListener(
        'error',
        function (event) {
          var el = event.target;
          var failed = el && (el.tagName === 'SCRIPT' || (el.tagName === 'LINK' && el.rel === 'stylesheet'));
          var note = document.getElementById('boot-note');
          if (failed && note && !window.namaeUnsupported) note.hidden = false;
        },
        true
      );
    </script>
    <noscript>Namae needs JavaScript to run.</noscript>
  </body>
</html>
